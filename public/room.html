<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table — Anofelis</title>
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/room.css">
</head>
<body class="page-table">
  <header class="barre">
    <a class="marque" href="/">Anofelis</a>
    <div class="titre-table">
      <span id="titre-scenario">Table</span>
      <span class="code-table" id="code">······</span>
      <button class="lien" id="copier" type="button" title="Copier le lien de la table">Copier le lien</button>
      <a class="lien" id="lien-guide" href="#" target="_blank" rel="noopener" hidden title="Livret de campagne (PDF, FFG)">Guide</a>
    </div>
    <div class="moi" id="moi"></div>
  </header>

  <p class="bandeau" id="bandeau-cdn" hidden>
    Les images des cartes (cdn.arkham.build) ne répondent pas : la table reste utilisable, mais les cartes apparaîtront sans illustration.
  </p>
  <p class="etat" id="etat">Connexion à la table…</p>

  <main id="lobby" class="lobby" hidden></main>

  <main id="tapis" class="tapis" hidden>
    <div class="barre-phase">
      <div class="manche-phase"><span id="manche"></span><div class="phases" id="phases"></div></div>
      <div class="tour" id="tour"></div>
      <div class="commandes">
        <button class="bouton secondaire icone" id="generer-carte" type="button" title="Générer n'importe quelle carte du jeu (nom, code ou lien arkham.build)" aria-label="Générer une carte">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="bouton" id="phase-suivante" type="button">Phase suivante</button>
        <div class="hote" id="hote-commandes"></div>
      </div>
    </div>

    <aside class="gauche">
      <section class="histoire" id="histoire"></section>
    </aside>

    <section class="plateau-zone" id="board" data-drop="board" aria-label="Zone des lieux">
      <div class="plateau" id="plateau"></div>
      <div id="loupe" class="loupe" hidden><img alt=""></div>
      <div class="table-outils" data-drop="none">
        <section class="pioches" id="pioches"></section>
        <section class="chaos" id="chaos"></section>
      </div>
      <div class="zoom">
        <button type="button" id="zoom-moins" title="Zoom arrière">−</button>
        <button type="button" id="zoom-recentrer" title="Recadrer sur les lieux">Recentrer</button>
        <button type="button" id="zoom-plus" title="Zoom avant">+</button>
      </div>
    </section>

    <aside class="droite">
      <section class="cote" id="aside"><h2>De côté, hors jeu</h2><div class="bande"></div></section>
      <section class="victoire" id="victory"><h2>Zone de victoire</h2><div class="bande"></div></section>
      <section class="journal" id="journal"><h2>Journal de bord</h2><ol></ol></section>
    </aside>

    <footer class="sieges" id="sieges"></footer>
  </main>

  <div id="rappels" class="rappels" aria-live="polite"></div>
  <script type="module" src="/js/room/main.js"></script>
</body>
</html>
