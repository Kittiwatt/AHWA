<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board joueur — Anofelis</title>
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/room.css">
  <link rel="stylesheet" href="/css/joueur.css">
</head>
<body class="page-table page-joueur">
  <header class="barre">
    <a class="marque" href="/">Anofelis</a>
    <div class="titre-table">
      <span id="titre-scenario">Board joueur</span>
      <span class="code-table" id="code">······</span>
      <a class="lien" id="lien-table" href="#" title="Ouvrir la table (tapis du scénario)">Table</a>
    </div>
    <div class="moi" id="moi"></div>
  </header>

  <p class="bandeau" id="bandeau-cdn" hidden>
    Les images des cartes (cdn.arkham.build) ne répondent pas : le board reste utilisable, mais les cartes apparaîtront sans illustration.
  </p>
  <p class="etat" id="etat">Connexion à la table…</p>

  <!-- Avant le lancement, ou pour rejoindre le siège -->
  <main id="attente" class="attente-joueur" hidden></main>

  <!-- Board du siège consulté (le sien : actif ; un autre : lecture seule) -->
  <main id="board-joueur" class="board-joueur" hidden>
    <div class="barre-phase">
      <div class="manche-phase"><span id="manche"></span><div class="phases" id="phases"></div></div>
      <div class="tour" id="tour"></div>
      <div class="commandes">
        <section class="chaos" id="chaos" aria-label="Sac du chaos"></section>
        <button class="bouton" id="phase-suivante" type="button">Phase suivante</button>
      </div>
    </div>
    <nav class="onglets-sieges" id="onglets" aria-label="Sièges"></nav>
    <section class="entete-joueur" id="entete"></section>
    <div class="corps-board">
      <aside class="piles-joueur" id="piles-joueur"></aside>
      <section class="jeu-joueur" id="jeu"></section>
      <div id="loupe" class="loupe" hidden><img alt=""></div>
    </div>
    <footer class="main-joueur" id="main"></footer>
  </main>

  <div id="rappels" class="rappels" aria-live="polite"></div>
  <script type="module" src="/js/room/joueur.js"></script>
</body>
</html>
